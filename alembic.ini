# =============================================================================
# Alembic Configuration
# =============================================================================
# Database migration tool for SQLAlchemy.
#
# Key points:
# - sqlalchemy.url is set dynamically in env.py (not hardcoded here).
# - Ruff is used as a post-write hook to auto-format generated migrations.
# =============================================================================

[alembic]
# Path to the migration scripts directory.
script_location = alembic

# Template for generating migration filenames.
# Includes timestamp for chronological ordering.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for file_template timestamps.
timezone = UTC

# Truncate long migration messages in filenames.
truncate_slug_length = 40

# sqlalchemy.url is intentionally left BLANK.
# It's set dynamically in env.py from app.config.settings.DATABASE_URL.
# This ensures migrations use the exact same DB config as the app
# and respects the active .env file.
sqlalchemy.url =

# ---- Logging ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# ---- Post-write hooks ----
# Auto-format migration scripts after generation.
[post_write_hooks]
# hooks = ruff_format, ruff_lint

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME
